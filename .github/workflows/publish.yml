name: Publish to PyPI

# Tag-triggered. Three things follow from that, all of which were missing when this
# was `workflow_dispatch` only:
#   - the tests below gate the release, instead of a manual dispatch being able to
#     publish a tree with failing tests;
#   - the repo gets a record of what shipped (a `vX.Y.Z` tag), rather than a PyPI
#     release with no corresponding tag;
#   - re-publishing is a deliberate act, rather than an accidental dispatch that
#     fails with an opaque PyPI 409 because the version was not bumped.
#
# Release checklist: bump `version` in pyproject.toml, add the CHANGELOG entry,
# then `git tag vX.Y.Z && git push --tags`.
on:
  push:
    tags: ["v*"]
  # Kept for a dry run: builds and uploads the artifacts, but the publish job only
  # runs for a tag, so a dispatch cannot reach PyPI.
  workflow_dispatch:

jobs:
  tests:
    # The release gate. Reuses test.yml rather than restating its steps.
    uses: ./.github/workflows/test.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'EOF'
          import glob, os, re, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          wheel = os.path.basename(glob.glob("dist/assist_sim-*.whl")[0])
          version = re.match(r"assist_sim-([^-]+)-", wheel).group(1)
          if version != tag:
              sys.exit(
                  f"tag v{tag} does not match the packaged version {version}; "
                  f"bump `version` in pyproject.toml before tagging."
              )
          print(f"tag v{tag} matches the packaged version")
          EOF

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Only a tag publishes; a workflow_dispatch stops after building.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
