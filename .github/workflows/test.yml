name: tests

on:
  # `revision` collects the fixes for the MyoAssist 1.0 manuscript revision before they
  # merge to main, so its pushes and the pull requests into it run the same checks.
  push:
    branches: [main, revision]
  pull_request:
    branches: [main, revision]
  # Reusable by publish.yml, which gates a release on these checks passing.
  workflow_call:

jobs:
  lint:
    # Ruff is Python-version independent, so run it once rather than per matrix leg.
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev deps
        # requirements-dev.txt pins ruff, so CI and local report the same findings.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - run: ruff check .
      - run: ruff format --check .

  test:
    # The reproducible lane: the pinned stack from requirements.txt, whose mujoco 3.4.0 is
    # the floor of the declared range. A Python-version break shows at one end of the
    # range (a newer feature fails on 3.10, a removal on 3.13), so only the ends run, on
    # Windows, the development platform. Linux and macOS run the newest Python, for
    # path-separator and file-locking regressions.
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.13" }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install assist_sim + pinned dev deps
        # myo-sim is a published dependency, so `pip install -e .` pulls it and the
        # myo_sim-dependent tests run as part of the suite. requirements-dev.txt is
        # installed second on purpose: it pins mujoco to the reproducible version.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q --tb=short

  mujoco-range:
    # The lane the `test` job cannot be: requirements-dev.txt pins mujoco, so every
    # reproducible leg silently downgrades whatever `pip install -e .` resolved. That
    # means the *declared* range in pyproject.toml goes untested at the top -- which is
    # how an unbounded `mujoco>=3.4` shipped in a wheel that could not combine a device
    # on any mujoco past 3.6. This job installs without the pin file, so it tests what
    # a plain `pip install assist-sim` user actually gets: the newest mujoco the range
    # allows. The floor, 3.4.0, is the pin of the `test` lane.
    #
    # If this job fails on a newly released mujoco, that is the signal to fix the
    # incompatibility and then raise the ceiling in pyproject.toml -- not to relax this job.
    name: mujoco range (ceiling)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install without the pin file
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          python -c "import mujoco; print('resolved mujoco', mujoco.__version__)"

      - name: Run tests
        run: pytest -q --tb=short

  package:
    name: wheel contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --wheel

      - name: Verify the wheel carries the device configs and assets
        run: |
          python -c "
          import glob, zipfile
          whl = glob.glob('dist/assist_sim-*.whl')[0]
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
          assert any(n.endswith('.yaml') for n in names), 'device YAMLs missing from wheel'
          assert any(n.endswith('.stl') for n in names), 'mesh STLs missing from wheel'
          assert any(n.endswith('.obj') for n in names), 'collision OBJs missing from wheel'
          assert 'assist_sim/py.typed' in names, 'py.typed marker missing'
          print(f'Wheel OK: {len(names)} files')
          "
