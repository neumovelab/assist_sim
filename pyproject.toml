[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assist_sim"
version = "0.5.2"
description = "Programmatic combination of musculoskeletal models and assistive devices for MyoAssist training"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Calder Robbins", email = "robbins.cal@northeastern.edu" },
]
keywords = [
    "mujoco",
    "musculoskeletal",
    "biomechanics",
    "simulation",
    "prosthetics",
    "exoskeleton",
    "myoassist",
    "myosuite",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # MjSpec.delete (in-memory model surgery, no XML round-trip) needs 3.3.4, but the
    # floor is >=3.4 to match myo_sim (which requires it) and the verified stack.
    "mujoco>=3.4",
    "PyYAML>=6.0.2",
    "numpy>=1.24",
    # Every MSK key resolves via myo_sim.load_spec(<model>); required at runtime.
    "myo-sim>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff",
]

[project.scripts]
assist-sim = "assist_sim.__main__:main"

[project.urls]
Homepage = "https://github.com/neumovelab/assist_sim"
Source = "https://github.com/neumovelab/assist_sim"
"Bug Tracker" = "https://github.com/neumovelab/assist_sim/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["assist_sim*"]
exclude = ["tests*", "examples*", "docs*"]

# Bundle device configs, model XMLs, and meshes inside the wheel.  Without this
# block, a `pip install assist_sim` user would get the Python code but zero
# device configs (models/ would be empty on their system).  Mirrors the
# pip-installable wheel pattern used by `myo_sim`.
[tool.setuptools.package-data]
assist_sim = [
    "models/**/*.yaml",
    "models/**/*.xml",
    "models/**/*.stl",
    "models/**/*.obj",   # collision/visual meshes (e.g. Wheelchair handrails, MPL pedestal)
    "models/**/*.msh",   # MuJoCo binary meshes (e.g. YCB gelatin box)
    "models/**/*.png",   # textures referenced by <texture file=...> (MPL scenes, YCB)
    "models/**/*.json",  # runtime data (e.g. bionic-bimanual keyframes)
    "models/MPL/LICENSE",
    "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Lint/format config -- mirrors myo_sim so tooling is consistent across both repos.
[tool.ruff]
line-length = 128
extend-exclude = [".claude", "external"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
