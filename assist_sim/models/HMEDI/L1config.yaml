device:
  name: "HMEDI_L1"
  model_xml: "L1model.xml"
  # HMEDI's torso band needs a torso'd MSK. Every leg model qualifies -- the
  # planar 22-muscle myolegs22, the 26-muscle myolegs26 and the 80-muscle myolegs
  # share the same passive torso scaffold -- as does myofullbody.
  compatible_msk: [myolegs22, myolegs26, myolegs, myofullbody]

# HMEDI's hip-extension assistance is driven by two spatial-tendon "cable"
# actuators (Exo_R/Exo_L) that wrap over sites on the torso + thigh
# subassemblies. Each cable runs from the torso piece down to the femur flap,
# behind the hip joint (the sites are 0.10-0.17 m posterior of the hip centre),
# so it lengthens as the hip flexes (+0.09 to +0.10 m/rad). The actuators pull
# only (ctrlrange [-1, 0], 100 N at -1), which gives about 10 N*m of hip
# extension torque on all four MSKs. Both the cables and their tendon-transmission actuators
# are authored in L1model.xml (<tendon> and <actuator> sections) and
# imported into the combined model by the pipeline with the device prefix.
# Joint-transmission actuators (none for HMEDI) would be authored here in
# the YAML's `actuators:` section.

attachments:
  default:
    # Pelvis
    - device_body: "hmedi waistband"
      parent_body: "pelvis"
    # Torso
    - device_body: "hmedi_torso"
      parent_body: "torso"
    # Femur R (femurflap + thigh each carry a nested MM03 cobra actuator body)
    - device_body: "hmedi femurflap_r"
      parent_body: "femur_r"
    - device_body: "hmedi thigh_r"
      parent_body: "femur_r"
    # Femur L
    - device_body: "hmedi femurflap_l"
      parent_body: "femur_l"
    - device_body: "hmedi thigh_l"
      parent_body: "femur_l"
  # myolegs's `torso` body sits inside a `<body name="root" euler="0 0 -1.57">`
  # frame whose orientation differs from 22/26's torso. Rather than fight the
  # frame mismatch with a corrective quat, the legacy 80-muscle HMEDI model
  # bypasses `torso` entirely and attaches the device torso piece directly to
  # `pelvis` (which has the same quat as 22/26's pelvis). We mirror that: the
  # pos here is the legacy 80 value, equivalent to (22-torso-relative pos)
  # + (22-torso-pos in 22-pelvis) = (-0.125, 0.25, -0.1) + (-0.1007, 0.0815, 0)
  # ≈ (-0.23, 0.33, -0.1). No quat override needed.
  myolegs: &torsod_legs
    - device_body: "hmedi waistband"
      parent_body: "pelvis"
    # `pos` here is the FRAME offset (composes with the device body's authored
    # pos: -0.125, 0.25, -0.1). The legacy 80-muscle HMEDI places this body at
    # pelvis-relative (-0.23, 0.33, -0.1); the frame offset that yields that
    # total with our body pos is (-0.23 - -0.125, 0.33 - 0.25, -0.1 - -0.1) =
    # (-0.105, 0.08, 0).
    - device_body: "hmedi_torso"
      parent_body: "pelvis"
      pos: [-0.105, 0.08, 0]
    - device_body: "hmedi femurflap_r"
      parent_body: "femur_r"
    - device_body: "hmedi thigh_r"
      parent_body: "femur_r"
    - device_body: "hmedi femurflap_l"
      parent_body: "femur_l"
    - device_body: "hmedi thigh_l"
      parent_body: "femur_l"
  # myolegs26 is the same passive-torso scaffold + 26-muscle legs, so it reuses
  # the myolegs attachment verbatim (torso bypassed to pelvis, same frame).
  myolegs26: *torsod_legs

# --- Device <-> human contact excludes (myofullbody only) ---
# MuJoCo only auto-excludes parent/child bodies.  On myofullbody the torso is five
# spine joints from the pelvis, and the waistband (on pelvis) sits inside its
# collision geoms by design: unexcluded, it starts 71 mm deep and pushes apart at
# ~45 kN.  The femur flaps (on femur) swing into the torso at hip flexion, 7 mm
# deep in the walk poses.  On the leg lineages the torso is the pelvis's direct
# child, so MuJoCo already skips the waistband pair.
contact:
  excludes:
    default: []
    myofullbody:
      - ["hmedi waistband", "torso"]
      - ["hmedi femurflap_r", "torso"]
      - ["hmedi femurflap_l", "torso"]
