device:
  name: "OSL_KA_L1"
  model_xml: "KA_L1model.xml"

# --- Prosthetic: remove biological leg below the knee ---
# Femur cut plane is y = -0.283012 (the osl_femur_trans_r mesh).
body_removals:
  default:
    - "tibia_r"   # cascades to talus_r, calcn_r, toes_r + muscle attachment bodies
  # patella_r is a sibling of tibia_r, so the cascade misses it; left in place it
  # becomes 3 unconstrained DOFs floating inside the socket.
  myolegs: &r80_bodies
    - "tibia_r"
    - "patella_r"
  myofullbody: *r80_bodies

# --- Prosthetic: replace femur mesh with residual-limb version ---
mesh_replacements:
  default:
    - geom: "femur_r_geom_1"
      mesh: "osl_femur_trans_r"
  # myofullbody shares the 80-muscle leg naming, so its surgery == myolegs.
  myolegs: &r80_mesh
    - geom: "femur_r"
      mesh: "osl_femur_trans_r"
  myofullbody: *r80_mesh

# --- Prosthetic: drop the collider that outlives the residual bone ---
# femur2_col_r spans to y = -0.457 with contype=1: 0.174 m of active collider
# past the cut. 22/26 has no equivalent geom.
geom_removals:
  default: []
  myolegs: &r80_geoms
    - "femur2_col_r"
  myofullbody: *r80_geoms

# --- Prosthetic: reduce the residual femur ---
# Without this the prosthetic side outweighs the intact leg (100.7% on myolegs26).
# Mass-per-length fit truncated at the cut plane; retains 71.65% (22/26) /
# 69.98% (80) of segment length.
body_overrides:
  default:
    - name: "femur_r"
      mass: 6.59257             # 0.7088 x intact 9.30140
      diaginertia: [0.058591, 0.060168, 0.027375]
      ipos: [0, -0.14280, 0]
      iquat: [0.5, 0.5, -0.5, 0.5]
  myolegs: &r80_inertial
    - name: "femur_r"
      mass: 6.06705             # 0.7223 x intact 8.40000
      diaginertia: [0.065427, 0.065427, 0.019467]
      ipos: [0, -0.13808, -0.0005]
      iquat: [0.708013, -0.706200, 0, 0]
  myofullbody: *r80_inertial

# --- Attach prosthetic chain to the residual femur ---
attachments:
  - device_body: "osl_generic_socket"
    parent_body: "femur_r"

# --- Restore the sensors the amputation cascaded away ---
# Otherwise myolegs26 drops 12 sensors to 7 while the intact side keeps all of its.
sensors:
  default:
    - &r_foot_touch
      name: "r_foot"
      type: touch
      site: "r_foot_touch"
    - &r_toes_touch
      name: "r_toes"
      type: touch
      site: "r_toes_touch"
    - name: "r_knee_sensor"
      type: jointlimitfrc
      joint: "osl_knee_angle_r"
    - name: "r_ankle_sensor"
      type: jointlimitfrc
      joint: "osl_ankle_angle_r"
  # myolegs and myofullbody ship only the four leg touch sensors and no
  # jointlimitfrc at all, so restoring one here would make it the only sensor of
  # its kind in the model.
  myolegs: &touch_only
    - *r_foot_touch
    - *r_toes_touch
  myofullbody: *touch_only

# --- Remove muscles with no surviving joint to span ---
# Knee-only muscles (vasti/vas*, bifemsh/bfsh) can generate no moment without a
# knee. Hip-spanning muscles are re-anchored instead, see tendon_modifications.
# Redundant with the spec.delete cascade; kept as an explicit record.
actuator_removals:
  default:
    - "gastroc_r"
    - "soleus_r"
    - "tibant_r"
    - "edl_r"
    - "fdl_r"
    - "bifemsh_r"
  myolegs: &r80_act
    - "bfsh_r"
    - "edl_r"
    - "ehl_r"
    - "fdl_r"
    - "fhl_r"
    - "gaslat_r"
    - "gasmed_r"
    - "perbrev_r"
    - "perlong_r"
    - "soleus_r"
    - "tibant_r"
    - "tibpost_r"
    - "vasint_r"
    - "vaslat_r"
    - "vasmed_r"
  myofullbody: *r80_act

# --- Remove tendons for fully removed muscles ---
tendon_removals:
  default:
    - "bifemsh_r_tendon"
    - "gastroc_r_tendon"
    - "soleus_r_tendon"
    - "tib_ant_r_tendon"
    - "edl_r_tendon"
    - "fdl_r_tendon"
  myolegs: &r80_ten
    - "bfsh_r_tendon"
    - "edl_r_tendon"
    - "ehl_r_tendon"
    - "fdl_r_tendon"
    - "fhl_r_tendon"
    - "gaslat_r_tendon"
    - "gasmed_r_tendon"
    - "perbrev_r_tendon"
    - "perlong_r_tendon"
    - "soleus_r_tendon"
    - "tibant_r_tendon"
    - "tibpost_r_tendon"
    - "vasint_r_tendon"
    - "vaslat_r_tendon"
    - "vasmed_r_tendon"
  myofullbody: *r80_ten

# --- Surgical re-anchoring ---
# Runs BEFORE the removals, or the cascade destroys these muscles first.
# Every wrap point at or distal to the cut (y = -0.283012) moves, including ones
# on femur_r itself. Points are spread along the residual bone so no tendon
# segment has zero length. A wrap cylinder needs its sidesite moved too.
tendon_modifications:
  default:
    - name: "rect_fem_r_tendon"      # hip flexion survives
      wraps:
        - reposition_site: "rect_fem_r_rect_fem_r-P2"
          pos: [0.045, -0.2, 0.005]
        - replace_site: "rect_fem_r_rect_fem_r-P3"
          new_body: "femur_r"
          pos: [0.025, -0.275, 0.0075]
    - name: "hamstrings_r_tendon"    # hip extension survives
      wraps:
        - replace_site: "hamstrings_r_semimem_r-P2"
          new_body: "femur_r"
          pos: [0.01259, -0.265, 0.01207]
        - replace_site: "hamstrings_r_semimem_r-P3"
          new_body: "femur_r"
          pos: [0.01259, -0.28301, 0.01207]

  # The 80-muscle lineage splits the lumped muscles, so it re-anchors eight.
  # myofullbody's leg is identical to myolegs's, so one block covers both.
  myolegs: &r80_reanchor
    - name: "bflh_r_tendon"
      wraps:
        - replace_site: "bflh-P2_r"
          new_body: "femur_r"
          pos: [0.01183, -0.26500, 0.01376]
        - replace_site: "bflh-P3_r"
          new_body: "femur_r"
          pos: [0.01136, -0.28301, 0.01839]
    - name: "semimem_r_tendon"
      wraps:
        - replace_geom: "SM_at_condyles_wrap_r"
          new_body: "femur_r"
          pos: [0.02272, -0.27000, 0.01850]
        - replace_site: "SM_at_condyles_site_semimem_r"
          new_body: "femur_r"
          pos: [0.01769, -0.27000, 0.00720]
        - replace_site: "semimem-P2_r"
          new_body: "femur_r"
          pos: [0.01857, -0.28301, 0.00658]
    - name: "semiten_r_tendon"
      wraps:
        - replace_geom: "ST_at_condyles_wrap_r"
          new_body: "femur_r"
          pos: [0.02235, -0.26500, 0.01965]
        - replace_site: "ST_at_condyles_site_semiten_r"
          new_body: "femur_r"
          pos: [0.01585, -0.26500, 0.00875]
        - replace_site: "semiten-P2_r"
          new_body: "femur_r"
          pos: [0.01885, -0.27400, 0.00675]
        - replace_site: "semiten-P3_r"
          new_body: "femur_r"
          pos: [0.02451, -0.28301, 0.00640]
    - name: "grac_r_tendon"
      wraps:
        - replace_geom: "GR_at_condyles_wrap_r"
          new_body: "femur_r"
          pos: [0.02235, -0.26500, 0.01965]
        - replace_site: "GR_at_condyles_site_grac_r"
          new_body: "femur_r"
          pos: [0.01149, -0.26500, 0.01606]
        - replace_site: "grac-P2_r"
          new_body: "femur_r"
          pos: [0.02201, -0.27400, 0.00616]
        - replace_site: "grac-P3_r"
          new_body: "femur_r"
          pos: [0.02537, -0.28301, 0.00708]
    - name: "sart_r_tendon"
      wraps:
        # P2 already sits on femur_r, but at y = -0.357, past the cut.
        - reposition_site: "sart-P2_r"
          pos: [0.01780, -0.25000, 0.01004]
        - replace_site: "sart-P3_r"
          new_body: "femur_r"
          pos: [0.02058, -0.26500, 0.00708]
        - replace_site: "sart-P4_r"
          new_body: "femur_r"
          pos: [0.02231, -0.27400, 0.00615]
        - replace_site: "sart-P5_r"
          new_body: "femur_r"
          pos: [0.02817, -0.28301, 0.00760]
    - name: "tfl_r_tendon"
      wraps:
        # P3 already sits on femur_r, but at y = -0.405, past the cut.
        - reposition_site: "tfl-P3_r"
          pos: [0.02597, -0.26500, 0.02980]
        - replace_site: "tfl-P4_r"
          new_body: "femur_r"
          pos: [0.03314, -0.28301, 0.02026]
    - name: "addmagIsch_r_tendon"
      wraps:
        # Survives the cascade outright (nothing of it sits on tibia_r), but
        # both remaining points are on the part of the femur that was cut off.
        - reposition_geom: "AMisch_at_condyles_wrap_r"
          pos: [0.02272, -0.27000, 0.01850]
        - reposition_site: "addmagIsch-P2_r"
          pos: [0.02258, -0.28301, 0.00683]
    - name: "recfem_r_tendon"
      wraps:
        # Routes over a cylinder at y = -0.403 and through three sites on the
        # patella, which this config removes, then inserts on tibia_r.
        - reposition_geom: "KnExt_at_fem_wrap_r"
          pos: [0.02193, -0.25000, 0.02136]
        - replace_site: "KnExt_at_fem_site_recfem_r"
          new_body: "femur_r"
          pos: [0.02906, -0.25000, 0.01162]
        - replace_site: "recfem-P2_r"
          new_body: "femur_r"
          pos: [0.03348, -0.26000, 0.01904]
        - replace_site: "recfem-P3_r"
          new_body: "femur_r"
          pos: [0.03380, -0.27000, 0.01608]
        - replace_site: "recfem-P4_r"
          new_body: "femur_r"
          pos: [0.03062, -0.27600, 0.00987]
        - replace_site: "recfem-P5_r"
          new_body: "femur_r"
          pos: [0.03271, -0.28301, 0.01287]
  myofullbody: *r80_reanchor

# --- Re-derived operating ranges for the re-anchored muscles ---
# The compiler keeps authored lengthranges (LRopt.useexisting=1), so a re-anchored
# muscle would describe a path it no longer has: rectfem_r was [0.321, 0.510] and
# now operates over [0.227, 0.329], starting below its own lower bound.
# Values from a kinematic joint sweep (+1% span margin), which reproduces the
# authored intact ranges to within 3% of span. Untouched muscles keep theirs.
# myolegs22 is planar, so its values differ slightly from myolegs26's 3 hip DOFs.
actuator_overrides:
  myolegs22:
    - name: "rectfem_r"
      lengthrange: [0.228082, 0.326416]
    - name: "hamstrings_r"
      lengthrange: [0.242329, 0.342925]
  myolegs26:
    - name: "rectfem_r"
      lengthrange: [0.226056, 0.330193]
    - name: "hamstrings_r"
      lengthrange: [0.238041, 0.343585]
  myolegs: &r80_lengthrange
    - name: "bflh_r"
      lengthrange: [0.222201, 0.350565]
    - name: "semimem_r"
      lengthrange: [0.230001, 0.342120]
    - name: "semiten_r"
      lengthrange: [0.216483, 0.357490]
    - name: "grac_r"
      lengthrange: [0.212519, 0.345297]
    - name: "sart_r"
      lengthrange: [0.215456, 0.365997]
    - name: "tfl_r"
      lengthrange: [0.209568, 0.421643]
    - name: "addmagIsch_r"
      lengthrange: [0.212486, 0.353181]
    - name: "recfem_r"
      lengthrange: [0.237078, 0.344095]
  myofullbody: *r80_lengthrange

# --- Add prosthetic actuators ---
actuators:
  - name: "osl_knee_torque_actuator"
    type: "motor"
    joint: "osl_knee_angle_r"
    gainprm: [49.4]
    ctrlrange: [-2.88, 2.88]
    ctrllimited: true
    gear: [1.0]
  - name: "osl_ankle_torque_actuator"
    type: "motor"
    joint: "osl_ankle_angle_r"
    gainprm: [58.4]
    ctrlrange: [-2.88, 2.88]
    ctrllimited: true
    gear: [1.0]

keyframe_overrides:
  default:
    stand:
      pelvis_ty: 0.91
    walk_left:
      pelvis_ty: 0.88
      osl_knee_angle_r: 0.5
    walk_right:
      pelvis_ty: 0.88
      osl_knee_angle_r: 0.145
    squat:
      pelvis_ty: 0.735
      osl_knee_angle_r: 1.29
      osl_ankle_angle_r: 0.393
    lunge:
      pelvis_ty: 0.67
      osl_knee_angle_r: 1.6
  myolegs:
    walk_left:
      osl_knee_angle_r: 0.5
    walk_right:
      osl_knee_angle_r: 0.145
    squat:
      osl_knee_angle_r: 1.29
      osl_ankle_angle_r: 0.393
