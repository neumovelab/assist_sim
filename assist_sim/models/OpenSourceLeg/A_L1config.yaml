device:
  name: "OSL_A_L1"
  model_xml: "A_L1model.xml"

# --- Prosthetic: remove biological lower leg below the amputation ---
body_removals:
  - "talus_r"   # cascades to calcn_r, toes_r

# --- Prosthetic: reduce the residual limb ---
body_overrides:
  - name: "tibia_r"
    mass: 1.85375
    diaginertia: [0.0125, 0.0125, 0.00225]
    ipos: [0, -0.125, 0]
    iquat: [0.5, 0.5, -0.5, 0.5]

# --- Prosthetic: replace tibia mesh with residual-limb version ---
mesh_replacements:
  default:
    - geom: "tibia_r_geom_1"
      mesh: "osl_tibia_fibula_trans_r"
  # myofullbody shares the 80-muscle leg naming, so its surgery == myolegs.
  myolegs: &r80_mesh
    - geom: "tibia_r"
      mesh: "osl_tibia_fibula_trans_r"
  myofullbody: *r80_mesh

# --- Prosthetic: drop the surviving fibula geom (covered by stump mesh) ---
geom_removals:
  default:
    - "tibia_r_geom_2"
  myolegs: &r80_geom
    - "fibula_r"
    - "tibia2_col_r"
  myofullbody: *r80_geom

# --- Attach prosthetic chain to the residual tibia ---
attachments:
  - device_body: "osl_generic_socket"
    parent_body: "tibia_r"

# --- Restore the sensors the amputation cascaded away ---
sensors:
  default:
    - &r_foot_touch
      name: "r_foot"
      type: touch
      site: "r_foot_touch"
    - &r_toes_touch
      name: "r_toes"
      type: touch
      site: "r_toes_touch"
    - name: "r_ankle_sensor"
      type: jointlimitfrc
      joint: "osl_ankle_angle_r"
  # myolegs and myofullbody ship only the four leg touch sensors and no
  # jointlimitfrc at all, so restoring one here would make it the only sensor of
  # its kind in the model.
  myolegs: &touch_only
    - *r_foot_touch
    - *r_toes_touch
  myofullbody: *touch_only

# --- Remove muscles that crossed the removed ankle/foot ---
actuator_removals:
  default:
    - "soleus_r"
    - "tibant_r"
    - "edl_r"
    - "fdl_r"
  myolegs: &r80_act
    - "soleus_r"
    - "tibant_r"
    - "edl_r"
    - "fdl_r"
    - "gaslat_r"
    - "gasmed_r"
    - "bfsh_r"
    - "ehl_r"
    - "tibpost_r"
    - "perlong_r"
    - "fhl_r"
    - "perbrev_r"
  myofullbody: *r80_act

# --- Remove tendons for fully removed muscles ---
tendon_removals:
  default:
    - "soleus_r_tendon"
    - "tib_ant_r_tendon"
    - "edl_r_tendon"
    - "fdl_r_tendon"
  myolegs: &r80_ten
    - "soleus_r_tendon"
    - "tibant_r_tendon"
    - "edl_r_tendon"
    - "fdl_r_tendon"
    - "gaslat_r_tendon"
    - "gasmed_r_tendon"
    - "bfsh_r_tendon"
    - "ehl_r_tendon"
    - "tibpost_r_tendon"
    - "perlong_r_tendon"
    - "fhl_r_tendon"
    - "perbrev_r_tendon"
  myofullbody: *r80_ten

# --- Tendon waypoint truncation ---

# Surviving r-side tendons on OSL_A (transtibial) that may want tuning:
#   - gastroc_r_tendon  (P3 auto-pruned; P2 now terminal on wrap-site body)
#   - bifemsh_r_tendon  (knee-crossing; insertion was on tibia_r)

# tendon_modifications:
#   # `default` is used for the 22/26-muscle MSKs which share tendon naming
#   # (gastroc_r_tendon, etc.). The 80-muscle MSK uses different tendon names
#   # (gasmed_r / gaslat_r split, no shared gastroc), so we explicitly empty the
#   # myolegs override and add 80-specific entries here as needed.
#   default:
#     - name: "gastroc_r_tendon"
#       wraps:
#         - reposition_site: "gastroc_r_med_gas_r-P2"
#           pos: [0.0, 0.0, 0.0]
#   myolegs: []

# --- Add prosthetic actuator ---
actuators:
  - name: "osl_ankle_torque_actuator"
    type: "motor"
    joint: "osl_ankle_angle_r"
    gainprm: [58.4]
    ctrlrange: [-2.88, 2.88]
    ctrllimited: true
    gear: [1.0]

keyframe_overrides:
  default:
    stand:
      pelvis_ty: 0.91
    walk_left:
      pelvis_ty: 0.88
    walk_right:
      pelvis_ty: 0.88
    squat:
      pelvis_ty: 0.735
      osl_ankle_angle_r: 0.385
    lunge:
      pelvis_ty: 0.67
  myolegs:
    squat:
      osl_ankle_angle_r: 0.385
