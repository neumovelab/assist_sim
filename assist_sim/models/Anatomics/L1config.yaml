device:
  name: "Anatomics_L1"
  model_xml: "L1model.xml"
  compatible_msk: [myolegs22, myolegs26, myolegs, myofullbody]

# --- Additive ankle exoskeleton ---
# Rigid exo frame on the right shank + foot, plus bilateral instrumented
# soles/uppers that form the ground interface. Everything is welded (no device
# joints) and passive (no actuators).
attachments:
  # Right shank + foot exo frame
  - device_body: "shank_exo"
    parent_body: "tibia_r"
  - device_body: "front_foot_exo"
    parent_body: "calcn_r"
  - device_body: "back_foot_exo"
    parent_body: "calcn_r"
  # Bilateral instrumented soles / uppers
  - device_body: "r_aft_sole"
    parent_body: "calcn_r"
  - device_body: "r_aft_upper"
    parent_body: "calcn_r"
  - device_body: "r_fore_sole"
    parent_body: "toes_r"
  - device_body: "r_fore_upper"
    parent_body: "toes_r"
  - device_body: "l_aft_sole"
    parent_body: "calcn_l"
  - device_body: "l_aft_upper"
    parent_body: "calcn_l"
  - device_body: "l_fore_sole"
    parent_body: "toes_l"
  - device_body: "l_fore_upper"
    parent_body: "toes_l"

# --- Device <-> human contact excludes (freejoint lineages only) ---
# MuJoCo only auto-excludes parent/child bodies.  The freejoint lineages (myolegs,
# myofullbody) carry extra foot and shank colliders (foot_col1/3/4 on calcn,
# tibia1/2_col on tibia) that the shoe uppers and the exo's shank and rear-foot pieces sit inside by design.
# Unexcluded, they start interpenetrated by 36-46 mm and push apart at up to
# ~5 kN.  Same r_aft_upper / tibia_r pair as STRIDE's exclude.
contact:
  excludes:
    default: []
    myolegs: &exc_freejoint
      - ["r_aft_upper", "tibia_r"]
      - ["l_aft_upper", "tibia_l"]
      - ["shank_exo", "calcn_r"]
      - ["back_foot_exo", "tibia_r"]
    myofullbody: *exc_freejoint

# --- Re-point the foot GRF sensors onto the shoe sole ---
# The instrumented sole is the ground interface, not the bare calcn/toes, so the
# baseline touch sensors (boxes on calcn_r / toes_r) sit above the floor and read
# zero.  Drop them and re-declare against the device sole sites (r_sole_touch /
# r_forefoot_touch in L1model.xml).  Same shoe + wiring as Humotech and STRIDE.
sensor_removals:
  - "r_foot"
  - "r_toes"
  - "l_foot"
  - "l_toes"

sensors:
  - {name: "r_foot", type: touch, site: "r_sole_touch"}
  - {name: "r_toes", type: touch, site: "r_forefoot_touch"}
  - {name: "l_foot", type: touch, site: "l_sole_touch"}
  - {name: "l_toes", type: touch, site: "l_forefoot_touch"}
