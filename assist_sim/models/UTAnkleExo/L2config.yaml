# =============================================================================
# UT Ankle Exoskeleton (bilateral) -- assist_sim device config.
#
# Unlike the rigidly re-parented devices (DephyExoBoot, Humotech, ...), the UT
# exo is a *free-floating* mechanism: each side is its own body tree (part3 ->
# part2/part1, two internal hinges, a spring tendon, and an actuated cable).
# Each root attaches to `world` (keeping its <freejoint>) and is clamped to the
# leg via <equality><connect> point constraints -- faithful to the source
# myoleg_abodomen_exo_double.xml. Biology is untouched (no removals); the exo
# assists ankle plantar/dorsiflexion through the cable actuators.
#
# Source: myosuite/simhive/exo_sim (Copyright 2024 Vikash Kumar).
# =============================================================================
device:
  name: "UTAnkleExo_L2"
  model_xml: "L2model.xml"
  compatible_msk: ["myolegs22", "myolegs26", "myolegs", "myofullbody"]

# Free-rooted attach: graft each exo root under worldbody (freejoint preserved).
# The source model fits the exo to myolegs. The right (dx) exo keeps that fit,
# and the left (sx) exo is its mirror image (the source left fit was 2.6 deg
# and 5-6 mm off the mirror). Every MSK takes the same pose relative to the
# ankle and foot. The pose is transferred in world space, through a frame at
# the ankle joint centre (forward = calcn -> toes, up = world z), because the
# body frames differ between lineages. The exo then sits within 0.1 mm of its
# myolegs pose relative to the foot bones. The myolegs22/26 tibia sits 9.9 mm
# behind the myolegs tibia relative to the talus, so there the shank clamp
# lands 9.9 mm further forward on the tibia. MuJoCo derives the leg side of each connect from this pose at qpos0,
# so a wrong pose still gives a zero residual at qpos0 (A-S4).
attachments:
  default: &att_myolegs26
    - device_body: "part3_dx"
      parent_body: "world"
      pos: [-0.15748, 0.03809, 0.02187]
      quat: [0.12090, -0.00005, 0.00040, 0.99267]
    - device_body: "part3_sx"
      parent_body: "world"
      pos: [0.09969, 0.27102, 0.02168]
      quat: [0.99257, -0.00040, 0.00005, 0.12169]
  myolegs26: *att_myolegs26
  myolegs22:
    - device_body: "part3_dx"
      parent_body: "world"
      pos: [-0.03809, -0.15748, -0.97813]
      quat: [0.61643, 0.00032, -0.00025, -0.78741]
    - device_body: "part3_sx"
      parent_body: "world"
      pos: [-0.27102, 0.09969, -0.97832]
      quat: [0.61581, -0.00032, -0.00025, 0.78790]
  myolegs:
    - device_body: "part3_dx"
      parent_body: "world"
      pos: [-0.1500, 0.0292, 0.0]
      quat: [0.12050, -0.00005, 0.00040, 0.99271]
    - device_body: "part3_sx"
      parent_body: "world"
      pos: [0.09198, 0.26233, -0.00019]
      quat: [0.99252, -0.00040, 0.00005, 0.12208]
  myofullbody:
    - device_body: "part3_dx"
      parent_body: "world"
      pos: [-0.1750, 0.1292, 0.0]
      quat: [0.12050, -0.00005, 0.00040, 0.99271]
    - device_body: "part3_sx"
      parent_body: "world"
      pos: [0.06698, 0.36233, -0.00019]
      quat: [0.99252, -0.00040, 0.00005, 0.12208]

# Point-to-point clamps, ported verbatim from the source model's <equality>.
# The anchor is in the device body's frame; MuJoCo computes the anchor in the
# leg body from the attachment pose at qpos0. dx -> right leg, sx -> left leg.
equality:
  # Right (dx)
  - type: "connect"
    device_body: "part3_dx"
    parent_body: "calcn_r"
    anchor: [-0.071, 0.05, 0.005]
  - type: "connect"
    device_body: "part3_dx"
    parent_body: "talus_r"
    anchor: [0.005, 0.06, 0.005]
  - type: "connect"
    device_body: "part2_dx"
    parent_body: "tibia_r"
    anchor: [0.012, 0.05, 0.1]
  # Left (sx)
  - type: "connect"
    device_body: "part3_sx"
    parent_body: "calcn_l"
    anchor: [-0.17, 0.05, 0.005]
  - type: "connect"
    device_body: "part3_sx"
    parent_body: "talus_l"
    anchor: [-0.25, 0.05, 0.004]
  - type: "connect"
    device_body: "part2_sx"
    parent_body: "tibia_l"
    anchor: [-0.24, 0.05, 0.1]

# With the source fit, the device hinge (joint2) is 31-41 mm above the
# anatomical ankle axis and 13-14 deg off it. Two clamps on the foot and one on
# the tibia then over-constrain the loop, and it cannot close when the ankle
# turns: the keyframe solve left 2.3 mm on myolegs at squat (A-S4). joint2
# moves onto the ankle axis of each lineage, in the part2 frame, so part2 turns
# with the tibia and joint2 equals the ankle angle. The myolegs axis is
# oblique, the myolegs22/26 axis is mediolateral. The meshes keep the source
# pose, so the drawn pin is 31-41 mm from the hinge, and the cable moment arm
# about the ankle is 69 mm (myolegs) and 74 mm (myolegs22/26), not the 68 mm
# about the pin. The values have nine digits: the loop has more equations than
# DOFs, so a hinge that is off the ankle axis by the rounding of a 5-digit value
# (1e-6 m) leaves the reset projection of myoassist open by 4e-7 m. myolegs22
# and myolegs26 differ at that level, so each has its own block.
joint_overrides:
  default: &hinge_myolegs26
    - {name: "UTAnkleExo_L2_joint2_dx", pos: [-0.032409541, 0.000640114, -0.030440838], axis: [-0.240798049, 0.970575242, -0.000002547]}
    - {name: "UTAnkleExo_L2_joint2_sx", pos: [-0.197465907, 0.001108985, -0.030438516], axis: [-0.240797984, -0.970575258, 0.000001905]}
  myolegs26: *hinge_myolegs26
  myolegs22:
    - {name: "UTAnkleExo_L2_joint2_dx", pos: [-0.032408899, 0.000640273, -0.030440607], axis: [-0.240801425, 0.970574404, -0.000000810]}
    - {name: "UTAnkleExo_L2_joint2_sx", pos: [-0.197466182, 0.001109053, -0.030439766], axis: [-0.240789613, -0.970577335, 0.000000168]}
  myolegs: &hinge_gait2392
    - {name: "UTAnkleExo_L2_joint2_dx", pos: [-0.040148083, 0.006520293, -0.040530168], axis: [-0.133838838, 0.975604851, 0.174018216]}
    - {name: "UTAnkleExo_L2_joint2_sx", pos: [-0.189784391, 0.007001074, -0.040442646], axis: [-0.133836306, -0.975604977, -0.174019457]}
  myofullbody: *hinge_gait2392
