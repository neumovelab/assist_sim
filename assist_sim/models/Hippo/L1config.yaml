device:
  name: "Hippo_L1"
  model_xml: "L1model.xml"
  compatible_msk: ["myolegs22", "myolegs26", "myolegs", "myofullbody"]

# Rigid grafts: each device body keeps its own XML frame as the offset from its
# parent (no pos/quat override needed -- the source positions are relative to
# the same pelvis/femur bone frames myo_sim uses).
attachments:
  - device_body: "hippo_backplate"
    parent_body: "pelvis"
  - device_body: "hippo_thigh_r"
    parent_body: "femur_r"
  - device_body: "hippo_thigh_l"
    parent_body: "femur_l"

# Ideal hip-flexion actuators (fixed-gain joint transmission, bidirectional).
# Gain/range are starting values -- tune per controller; sign follows the MSK
# hip_flexion convention (positive = flexion).
actuators:
  - name: "Exo_R"
    type: "general"
    joint: "hip_flexion_r"
    gaintype: "fixed"
    gainprm: [100, 0, 0]
    biastype: "none"
    biasprm: [0, 0, 0]
    dyntype: "none"
    dynprm: [1, 0, 0]
    ctrlrange: [-1, 1]
    ctrllimited: true
    gear: [1.0]
  - name: "Exo_L"
    type: "general"
    joint: "hip_flexion_l"
    gaintype: "fixed"
    gainprm: [100, 0, 0]
    biastype: "none"
    biasprm: [0, 0, 0]
    dyntype: "none"
    dynprm: [1, 0, 0]
    ctrlrange: [-1, 1]
    ctrllimited: true
    gear: [1.0]

# --- Device <-> human contact excludes (myofullbody only) ---
# MuJoCo only auto-excludes parent/child bodies.  On myofullbody the torso is five
# spine joints from the pelvis, and the waist parts (backplate, hip shells, waist
# bands, motor housing) sit inside its collision geoms by design: unexcluded, they
# start up to 196 mm deep and push apart at up to ~68 kN.  The arms also hang
# through the hip shells and motor housing in the canonical poses, so every Hippo
# body is excluded against every arm and hand body that carries a collider (8 x 44
# pairs): the hands pass through the device instead of fighting it.  On the leg
# lineages the torso is the pelvis's direct child and there are no arms.
contact:
  excludes:
    default: []
    myofullbody:
      - ["hippo_backplate", "torso"]
      - ["hippo_hipshell_lr", "torso"]
      - ["hippo_waist_bands", "torso"]
      - ["hippo_ak10_9", "torso"]
      # hippo_backplate <-> arm and hand
      - ["hippo_backplate", "humerus_r"]
      - ["hippo_backplate", "ulna_r"]
      - ["hippo_backplate", "radius_r"]
