device:
  name: "OpenExo_L1"
  model_xml: "L1model.xml"

attachments:
  # Tibia R
  - device_body: "exo_shaft_r"
    parent_body: "tibia_r"
  - device_body: "exo_cuff_r"
    parent_body: "tibia_r"
  # Calcn R
  - device_body: "exo_blade_r"
    parent_body: "calcn_r"
  # Tibia L
  - device_body: "exo_shaft_l"
    parent_body: "tibia_l"
  - device_body: "exo_cuff_l"
    parent_body: "tibia_l"
  # Calcn L
  - device_body: "exo_blade_l"
    parent_body: "calcn_l"

# The actuator values below are permissive starting values; the provided controllers
# were tuned on them. A line marked "to spec" sets the hardware rating instead: uncomment
# it, and for gainprm or ctrlrange also comment out the line it replaces. forcerange
# limits gain * ctrl before gear (gear is 1, so the unit is N*m).
# Spec: 28 N*m PF (MyoAssist 1.0 paper, Fig. 2). The model gives 100 N*m PF at full command.
# Model mass: 1.95 kg per leg (spec 1.95 kg per leg).
actuators:
  - name: "Exo_R"
    type: "general"
    joint: "ankle_angle_r"
    gaintype: "fixed"
    gainprm: [100, 0, 0]
    # gainprm: [28, 0, 0]  # to spec: full command gives 28 N*m PF
    biastype: "none"
    biasprm: [0, 0, 0]
    dyntype: "none"
    dynprm: [1, 0, 0]
    ctrlrange: [-1, 0]
    ctrllimited: true
    # forcerange: [-28, 0]  # to spec: limit at 28 N*m PF, gain unchanged
    gear: [1.0]
  - name: "Exo_L"
    type: "general"
    joint: "ankle_angle_l"
    gaintype: "fixed"
    gainprm: [100, 0, 0]
    # gainprm: [28, 0, 0]  # to spec: full command gives 28 N*m PF
    biastype: "none"
    biasprm: [0, 0, 0]
    dyntype: "none"
    dynprm: [1, 0, 0]
    ctrlrange: [-1, 0]
    ctrllimited: true
    # forcerange: [-28, 0]  # to spec: limit at 28 N*m PF, gain unchanged
    gear: [1.0]

# See the note in Tutorial/L1config.yaml: the myoLeg knee flexes negative, the 80-muscle
# and full-body knees flex positive, so the authored lunge knee needs its sign per lineage.
# Per-MSK blocks merge onto `default`.
# --- Device <-> human contact excludes (freejoint lineages only) ---
# MuJoCo only auto-excludes parent/child bodies.  The freejoint lineages (myolegs,
# myofullbody) carry extra foot and shank colliders (foot_col1/3/4 on calcn,
# tibia1/2_col on tibia) that the heel blades (on calcn) sit inside by design.
# Unexcluded, they start interpenetrated by 28 mm and push apart at up to ~3.2 kN.
contact:
  excludes:
    default: []
    myolegs: &exc_freejoint
      - ["exo_blade_r", "tibia_r"]
      - ["exo_blade_l", "tibia_l"]
    myofullbody: *exc_freejoint

keyframe_overrides:
  default:
    stand:
      pelvis_ty: 0.92
    walk_left:
      pelvis_ty: 0.89
    walk_right:
      pelvis_ty: 0.885
    squat:
      pelvis_ty: 0.73
    lunge:
      pelvis_ty: 0.675
      knee_angle_l: -1.25
  myolegs:
    lunge:
      knee_angle_l: 1.25
  myofullbody:
    lunge:
      knee_angle_l: 1.25
