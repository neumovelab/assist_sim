device:
  name: "KFoot_L1"
  model_xml: "L1model.xml"
  compatible_msk: [myolegs26, myolegs, myofullbody]

# --- Prosthetic: right transtibial (below-knee) amputation ---
# Same biological scope as OSL_A. The device is a passive powered-foot: a
# socket -> pylon -> ankle -> foot -> shell chain whose ankle is a passive
# spring-damper (df_/pf_ankle_angle_r, stiffness+damping baked into the device
# model).

# --- Remove biological lower leg below the amputation ---
body_removals:
  - "talus_r"   # cascades to calcn_r, toes_r

# --- Replace tibia mesh with the residual-limb version ---
# The residual stump mesh (tibia_fibula_trans_r) covers BOTH tibia and
# fibula; swap the tibia geom and drop the separate fibula geom (geom_removals)
# so it doesn't clip the stump.
mesh_replacements:
  default:
    - geom: "tibia_r_geom_1"
      mesh: "tibia_fibula_trans_r"
  # myofullbody shares the 80-muscle leg naming (tibia_r geom, fibula_r, etc.),
  # so its surgery is identical to myolegs -- aliased via YAML anchors below.
  myolegs: &r80_mesh
    - geom: "tibia_r"
      mesh: "tibia_fibula_trans_r"
  myofullbody: *r80_mesh

geom_removals:
  default:
    - "tibia_r_geom_2"
  myolegs: &r80_geom
    - "fibula_r"
  myofullbody: *r80_geom

# --- Attach the prosthetic chain to the residual tibia ---
attachments:
  - device_body: "kap_generic_socket"
    parent_body: "tibia_r"

# --- Remove muscles that crossed the removed ankle/foot ---
actuator_removals:
  default:
    - "soleus_r"
    - "tibant_r"
    - "edl_r"
    - "fdl_r"
  myolegs: &r80_act
    - "soleus_r"
    - "tibant_r"
    - "edl_r"
    - "fdl_r"
    - "gaslat_r"
    - "gasmed_r"
    - "bfsh_r"
    - "ehl_r"
    - "tibpost_r"
    - "perlong_r"
    - "fhl_r"
    - "perbrev_r"
  myofullbody: *r80_act

# --- Remove tendons for fully removed muscles ---
tendon_removals:
  default:
    - "soleus_r_tendon"
    - "tib_ant_r_tendon"
    - "edl_r_tendon"
    - "fdl_r_tendon"
  myolegs: &r80_ten
    - "soleus_r_tendon"
    - "tibant_r_tendon"
    - "edl_r_tendon"
    - "fdl_r_tendon"
    - "gaslat_r_tendon"
    - "gasmed_r_tendon"
    - "bfsh_r_tendon"
    - "ehl_r_tendon"
    - "tibpost_r_tendon"
    - "perlong_r_tendon"
    - "fhl_r_tendon"
    - "perbrev_r_tendon"
  myofullbody: *r80_ten
