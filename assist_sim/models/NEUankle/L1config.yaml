device:
  name: "NEUankle_L1"
  model_xml: "L1model.xml"
  compatible_msk: [myolegs22, myolegs26, myolegs, myofullbody]

# --- Prosthetic: right transtibial (below-knee) amputation ---

# --- Remove biological lower leg below the amputation ---
body_removals:
  - "talus_r"   # cascades to calcn_r, toes_r

# --- Reduce the residual limb ---
body_overrides:
  - name: "tibia_r"
    mass: 1.85375
    diaginertia: [0.0125, 0.0125, 0.00225]
    ipos: [0, -0.125, 0]
    iquat: [0.5, 0.5, -0.5, 0.5]

# --- Replace tibia mesh with the residual-limb version ---
mesh_replacements:
  default:
    - geom: "tibia_r_geom_1"
      mesh: "tibia_fibula_trans_r"
  # myofullbody shares the 80-muscle leg naming (tibia_r geom, fibula_r, etc.),
  # so its surgery is identical to myolegs -- aliased via YAML anchors below.
  myolegs: &r80_mesh
    - geom: "tibia_r"
      mesh: "tibia_fibula_trans_r"
  myofullbody: *r80_mesh

geom_removals:
  default:
    - "tibia_r_geom_2"
  myolegs: &r80_geom
    - "fibula_r"
    - "tibia2_col_r"
  myofullbody: *r80_geom

# --- Attach the prosthetic chain to the residual tibia ---
attachments:
  - device_body: "neuankle_generic_socket"
    parent_body: "tibia_r"

# --- Powered ankle ---
# 50 Nm continuous, expressed directly as joint torque. The 122 Nm instantaneous
# rating is thermal headroom, and MuJoCo carries no thermal state, so peak torque
# belongs in a torque-squared penalty in the objective rather than in the model.
# Reflected motor inertia is deliberately unmodelled, matching OSL_A; it would go
# in armature on neuankle_ankle_angle_r.
actuators:
  - name: "neuankle_ankle_torque_actuator"
    type: "motor"
    joint: "neuankle_ankle_angle_r"
    gainprm: [50]
    ctrlrange: [-1, 1]
    ctrllimited: true
    gear: [1.0]

# --- Restore the sensors the amputation cascaded away ---
sensors:
  default:
    - &r_foot_touch
      name: "r_foot"
      type: touch
      site: "r_foot_touch"
    - &r_toes_touch
      name: "r_toes"
      type: touch
      site: "r_toes_touch"
    - name: "r_ankle_sensor"
      type: jointlimitfrc
      joint: "neuankle_ankle_angle_r"
  # myolegs and myofullbody ship only the four leg touch sensors and no
  # jointlimitfrc at all, so restoring one here would make it the only sensor of
  # its kind in the model.
  myolegs: &touch_only
    - *r_foot_touch
    - *r_toes_touch
  myofullbody: *touch_only

# --- Remove muscles that crossed the removed ankle/foot ---
actuator_removals:
  default:
    - "soleus_r"
    - "tibant_r"
    - "edl_r"
    - "fdl_r"
  # gaslat_r / gasmed_r cross the surviving knee and are re-anchored below.
  # bfsh_r runs femur_r -> tibia_r, both surviving: no doomed wrap point, so
  # deleting it was never justified.
  myolegs: &r80_act
    - "soleus_r"
    - "tibant_r"
    - "edl_r"
    - "fdl_r"
    - "ehl_r"
    - "tibpost_r"
    - "perlong_r"
    - "fhl_r"
    - "perbrev_r"
  myofullbody: *r80_act

# --- Remove tendons for fully removed muscles ---
tendon_removals:
  default:
    - "soleus_r_tendon"
    - "tib_ant_r_tendon"
    - "edl_r_tendon"
    - "fdl_r_tendon"
  myolegs: &r80_ten
    - "soleus_r_tendon"
    - "tibant_r_tendon"
    - "edl_r_tendon"
    - "fdl_r_tendon"
    - "ehl_r_tendon"
    - "tibpost_r_tendon"
    - "perlong_r_tendon"
    - "fhl_r_tendon"
    - "perbrev_r_tendon"
  myofullbody: *r80_ten

# --- Surgical re-anchoring ---
# Runs BEFORE the removals, or the cascade destroys gastroc first. It spans knee
# and ankle; the ankle is gone but the knee survives, so it re-attaches to the
# residual tibia (cut plane y = -0.218900) as a knee flexor. Only the calcaneal
# insertion moves -- the proximal points sit on femur_r and survive.
tendon_modifications:
  default:
    - name: "gastroc_r_tendon"
      wraps:
        - replace_site: "gastroc_r_med_gas_r-P3"
          new_body: "tibia_r"
          pos: [-0.02631, -0.21890, 0.02034]
  # 80-muscle splits gastroc into medial/lateral heads, co-located at the same
  # calcaneal point in the source. myofullbody's leg is identical to myolegs's.
  myolegs: &r80_reanchor
    - name: "gasmed_r_tendon"
      wraps:
        - replace_site: "gasmed-P2_r"
          new_body: "tibia_r"
          pos: [-0.02631, -0.21890, 0.02034]
    - name: "gaslat_r_tendon"
      wraps:
        - replace_site: "gaslat-P2_r"
          new_body: "tibia_r"
          pos: [-0.02631, -0.21890, 0.02034]
  myofullbody: *r80_reanchor

# --- Re-derived operating range for the re-anchored gastrocnemius ---
# The compiler keeps authored lengthranges (LRopt.useexisting=1). Re-anchoring
# drops the ankle from gastroc's path, so [0.362, 0.490] is far too long: it now
# operates over [0.203, 0.229] as a knee-only muscle. Kinematic joint sweep,
# +1% span margin. Untouched muscles keep their authored values.
actuator_overrides:
  default:
    - name: "gastroc_r"
      lengthrange: [0.202513, 0.229413]
  myolegs: &r80_lengthrange
    - name: "gasmed_r"
      lengthrange: [0.233136, 0.277399]
    - name: "gaslat_r"
      lengthrange: [0.218863, 0.260048]
  myofullbody: *r80_lengthrange
