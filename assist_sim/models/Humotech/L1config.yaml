device:
  name: "Humotech_L1"
  model_xml: "L1model.xml"

attachments:
  # Tibia R
  - device_body: "shin_cuff_r"
    parent_body: "tibia_r"
  - device_body: "shin_main_r"
    parent_body: "tibia_r"
  # Calcn R
  - device_body: "heel_ring_r"
    parent_body: "calcn_r"
  - device_body: "heel_connector_r"
    parent_body: "calcn_r"
  - device_body: "sole_attachment_r"
    parent_body: "calcn_r"
  - device_body: "r_aft_sole"
    parent_body: "calcn_r"
  - device_body: "r_aft_upper"
    parent_body: "calcn_r"
  # Toes R
  - device_body: "r_fore_sole"
    parent_body: "toes_r"
  - device_body: "r_fore_upper"
    parent_body: "toes_r"
  # Tibia L
  - device_body: "shin_cuff_l"
    parent_body: "tibia_l"
  - device_body: "shin_main_l"
    parent_body: "tibia_l"
  # Calcn L
  - device_body: "heel_ring_l"
    parent_body: "calcn_l"
  - device_body: "heel_connector_l"
    parent_body: "calcn_l"
  - device_body: "sole_attachment_l"
    parent_body: "calcn_l"
  - device_body: "l_aft_sole"
    parent_body: "calcn_l"
  - device_body: "l_aft_upper"
    parent_body: "calcn_l"
  # Toes L
  - device_body: "l_fore_sole"
    parent_body: "toes_l"
  - device_body: "l_fore_upper"
    parent_body: "toes_l"

joint_overrides:
  - name: "mtp_angle_r"
    range: [0.2, 0.5]
  - name: "mtp_angle_l"
    range: [0.2, 0.5]

# The actuator values below are permissive starting values; the provided controllers
# were tuned on them. A line marked "to spec" sets the hardware rating instead: uncomment
# it, and for gainprm or ctrlrange also comment out the line it replaces. forcerange
# limits gain * ctrl before gear (gear is 1, so the unit is N*m).
# Spec: 100 N*m PF and 50 N*m DF (MyoAssist 1.0 paper, Fig. 2). The model gives 100 N*m PF and no DF.
# Model mass: 2.19 kg per leg of hardware (spec 2.2 kg per leg), plus the 0.33-kg split shoe.
actuators:
  - name: "Exo_R"
    type: "general"
    joint: "ankle_angle_r"
    gaintype: "fixed"
    gainprm: [100, 0, 0]
    biastype: "none"
    biasprm: [0, 0, 0]
    dyntype: "none"
    dynprm: [1, 0, 0]
    ctrlrange: [-1, 0]
    # ctrlrange: [-1, 0.5]  # to spec: adds the 50 N*m DF rating
    ctrllimited: true
    # forcerange: [-100, 50]  # to spec: limit at 100 N*m PF and 50 N*m DF
    gear: [1.0]
  - name: "Exo_L"
    type: "general"
    joint: "ankle_angle_l"
    gaintype: "fixed"
    gainprm: [100, 0, 0]
    biastype: "none"
    biasprm: [0, 0, 0]
    dyntype: "none"
    dynprm: [1, 0, 0]
    ctrlrange: [-1, 0]
    # ctrlrange: [-1, 0.5]  # to spec: adds the 50 N*m DF rating
    ctrllimited: true
    # forcerange: [-100, 50]  # to spec: limit at 100 N*m PF and 50 N*m DF
    gear: [1.0]

# --- Device <-> human contact excludes (freejoint lineages only) ---
# MuJoCo only auto-excludes parent/child bodies.  The freejoint lineages (myolegs,
# myofullbody) carry extra foot and shank colliders (foot_col1/3/4 on calcn,
# tibia1/2_col on tibia) that the shoe upper, shin piece and heel ring sit inside by design.
# Unexcluded, they start interpenetrated by 16-37 mm and push apart at up to
# ~5.7 kN.  Same pairs as STRIDE's r_aft_upper / tibia_r exclude.
contact:
  excludes:
    default: []
    myolegs: &exc_freejoint
      - ["r_aft_upper", "tibia_r"]
      - ["l_aft_upper", "tibia_l"]
      - ["shin_main_r", "calcn_r"]
      - ["shin_main_l", "calcn_l"]
      - ["heel_ring_r", "tibia_r"]
      - ["heel_ring_l", "tibia_l"]
    myofullbody: *exc_freejoint

# --- Re-point the foot GRF sensors onto the shoe sole ---
# The baseline touch sensors sit on the myo_sim foot sites 
# (a box on calcn_r / toes_r) which the shoe lifts off
# the floor, so they silently read zero.  Drop them and re-declare against the
# device's own sole sites (see r_sole_touch / r_forefoot_touch in L1model.xml).
sensor_removals:
  - "r_foot"
  - "r_toes"
  - "l_foot"
  - "l_toes"

sensors:
  - {name: "r_foot", type: touch, site: "r_sole_touch"}
  - {name: "r_toes", type: touch, site: "r_forefoot_touch"}
  - {name: "l_foot", type: touch, site: "l_sole_touch"}
  - {name: "l_toes", type: touch, site: "l_forefoot_touch"}

# See the note in Tutorial/L1config.yaml: the myoLeg knee flexes negative, the 80-muscle
# and full-body knees flex positive, so the authored lunge knee needs its sign per lineage.
# Per-MSK blocks merge onto `default`.
keyframe_overrides:
  default:
    stand:
      pelvis_ty: 0.96075
      mtp_angle_r: 0.2
      mtp_angle_l: 0.2
    walk_left:
      pelvis_ty: 0.9335
      mtp_angle_r: 0.2
      mtp_angle_l: 0.2
    walk_right:
      pelvis_ty: 0.9335
      mtp_angle_r: 0.2
      mtp_angle_l: 0.2
    squat:
      pelvis_ty: 0.78
      mtp_angle_r: 0.325
      mtp_angle_l: 0.325
    lunge:
      pelvis_ty: 0.725
      pelvis_tilt: -0.55
      mtp_angle_r: 0.4
      knee_angle_l: -1.09
      ankle_angle_l: 0.045
      mtp_angle_l: 0.26
  myolegs:
    lunge:
      knee_angle_l: 1.09
  myofullbody:
    lunge:
      knee_angle_l: 1.09
